# ArgoCD Root "App-of-Apps" pattern for MegaMart E-Commerce Modernization
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: megamart-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/megamart/megamart-ecommerce-gitops.git
    targetRevision: HEAD
    path: gitops/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
