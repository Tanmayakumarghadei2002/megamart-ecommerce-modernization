apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: megamart-catalog-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: megamart-ecommerce
spec:
  project: default
  source:
    repoURL: https://github.com/megamart/megamart-ecommerce-gitops.git
    targetRevision: HEAD
    path: gitops/environments/production
  destination:
    server: https://kubernetes.default.svc
    namespace: megamart-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
